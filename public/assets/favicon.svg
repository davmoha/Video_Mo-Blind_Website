      <stop offset="0%" stop-color="#1AD1B5" />
      <stop offset="100%" stop-color="#855df6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1AD1B5" flood-opacity="0.5"/>
